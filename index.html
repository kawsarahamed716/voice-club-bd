<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imo Voice Club - Pro Full Screen UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }
        /* Imo Style Staggered Mic Grid Layout */
        .mic-grid-container {
            position: relative;
            width: 100%;
            height: 380px;
        }
        .mic-slot {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto bg-slate-950 shadow-2xl overflow-hidden border-x border-slate-800 relative">

    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600" class="w-full h-full object-cover opacity-40 filter blur-[1px]" alt="Background">
        <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/40 to-black/90"></div>
    </div>

    <!-- Top Announcement Banner -->
    <div class="relative z-10 bg-emerald-600/90 text-white text-[11px] px-3 py-1 font-medium text-center truncate shadow">
        ✅ লাইভ পেমেন্ট: Owner আজ ৮৩,৫০ টাকা ক্যাশআউট করেছেন!
    </div>

    <!-- Header Section -->
    <header class="relative z-10 px-3 py-2 flex items-center justify-between">
        <div class="flex items-center space-x-2 bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/10 max-w-[55%]">
            <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center text-slate-950 font-bold shrink-0 shadow">
                <i class="fa-solid fa-crown text-xs"></i>
            </div>
            <div class="overflow-hidden">
                <h1 class="font-bold text-xs leading-tight text-white truncate">টাকাইলেই 🎸 গানে...</h1>
                <p class="text-[9px] text-slate-300 truncate">Members: 3.2K • রোল: OWNER</p>
            </div>
        </div>

        <!-- Diamonds & Balance -->
        <div class="flex items-center space-x-1.5">
            <div class="bg-black/50 backdrop-blur border border-white/10 px-2 py-1 rounded-full flex items-center space-x-1 text-[11px]">
                <i class="fa-solid fa-gem text-cyan-400 text-xs"></i>
                <span class="font-bold">50</span>
            </div>
            <div class="bg-black/50 backdrop-blur border border-white/10 px-2 py-1 rounded-full flex items-center space-x-1 text-[11px]">
                <span class="text-amber-400 font-bold">৳</span>
                <span class="font-bold">100</span>
            </div>
        </div>
    </header>

    <!-- Room Rank & Tags -->
    <div class="relative z-10 px-4 py-1 flex items-center space-x-2">
        <span class="bg-amber-500/80 text-slate-950 text-[10px] px-2 py-0.5 rounded-md font-bold flex items-center gap-1 shadow">
            <i class="fa-solid fa-trophy"></i> Hourly Rank 6
        </span>
        <span class="bg-amber-500 text-slate-950 text-[10px] px-2 py-0.5 rounded-full font-bold">Owner</span>
        <span class="bg-sky-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">Admin</span>
        <span class="bg-slate-700 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">Member</span>
    </div>

    <!-- Main Mic Stage Area (Imo Staggered Layout) -->
    <main class="relative z-10 flex-1 overflow-hidden px-2">
        <div class="mic-grid-container">
            
            <!-- Mic 1 (Owner / Crown) -->
            <div class="mic-slot" style="top: 18%; left: 15%;">
                <div class="relative w-12 h-12 rounded-full bg-slate-800 border-2 border-amber-400 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-crown text-amber-400 text-xs absolute -top-2 z-20"></i>
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-full h-full rounded-full object-cover" alt="Mic">
                    <span class="absolute -bottom-1 bg-amber-500 text-slate-950 text-[8px] px-1 rounded font-bold">আপনি (Own...</span>
                </div>
            </div>

            <!-- Mic 2 (Locked) -->
            <div class="mic-slot" style="top: 18%; left: 38%;">
                <div class="relative w-12 h-12 rounded-full bg-slate-800/80 border-2 border-slate-600 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-lock text-amber-400 text-xs"></i>
                    <span class="absolute -bottom-1 bg-slate-700 text-slate-300 text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">2</span>
                </div>
            </div>

            <!-- Mic 3 (Locked) -->
            <div class="mic-slot" style="top: 18%; left: 62%;">
                <div class="relative w-12 h-12 rounded-full bg-slate-800/80 border-2 border-slate-600 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-lock text-amber-400 text-xs"></i>
                    <span class="absolute -bottom-1 bg-slate-700 text-slate-300 text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">3</span>
                </div>
            </div>

            <!-- Mic 4 (Locked) -->
            <div class="mic-slot" style="top: 18%; left: 85%;">
                <div class="relative w-12 h-12 rounded-full bg-slate-800/80 border-2 border-slate-600 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-lock text-amber-400 text-xs"></i>
                    <span class="absolute -bottom-1 bg-slate-700 text-slate-300 text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">4</span>
                </div>
            </div>

            <!-- Mic 5 -->
            <div class="mic-slot" style="top: 3
